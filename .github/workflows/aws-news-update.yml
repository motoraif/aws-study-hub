name: Weekly AWS News Update

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-aws-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install feedparser python-dateutil

      - name: Fetch AWS What's New
        run: |
          python3 << 'PYEOF'
          import feedparser, json, os, re
          from datetime import datetime, timezone
          from dateutil import parser as dp

          PATH = 'data/aws-news.json'

          # Load existing cumulative archive (if any)
          existing = {"items": []}
          if os.path.exists(PATH):
              try:
                  with open(PATH) as f:
                      existing = json.load(f)
              except Exception:
                  existing = {"items": []}

          # Index existing items by their canonical key (link, falling back to title+date)
          def key(it):
              return (it.get('link') or '').strip() or (it.get('title','') + it.get('date',''))

          archive = {key(it): it for it in existing.get('items', [])}

          # Fetch the latest feed and merge in any new items
          feed = feedparser.parse("https://aws.amazon.com/about-aws/whats-new/recent/feed/")
          new_count = 0
          for entry in feed.entries[:25]:
              try: date = dp.parse(entry.get('published','')).strftime('%Y-%m-%d')
              except: date = 'Unknown'
              desc = re.sub(r'<[^>]+>','',entry.get('summary','')).strip()[:300]
              item = {"title":entry.get('title',''),"link":entry.get('link','#'),"date":date,"summary":desc}
              k = key(item)
              if k not in archive:
                  archive[k] = item
                  new_count += 1

          # Sort newest-first by date (unknown dates sink to the bottom)
          items = sorted(archive.values(), key=lambda x: x.get('date','0000-00-00'), reverse=True)

          os.makedirs('data', exist_ok=True)
          out = {
              "updated": datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC'),
              "note": "Cumulative AWS What's New archive. Auto-appended weekly by GitHub Actions. Do not edit manually.",
              "count": len(items),
              "items": items,
          }
          with open(PATH, 'w') as f:
              json.dump(out, f, indent=2)
          print(f"Added {new_count} new item(s); archive now has {len(items)} total")

          # Signal to later steps whether there were genuinely new items
          gh_out = os.environ.get('GITHUB_OUTPUT')
          if gh_out:
              with open(gh_out, 'a') as f:
                  f.write(f"new_count={new_count}\n")
          PYEOF
        id: fetch

      - name: Commit directly to main if changed
        if: steps.fetch.outputs.new_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/aws-news.json; then
            echo "No changes to commit"
          else
            git add data/aws-news.json
            git commit -m "chore: update AWS What's New feed $(date +%Y-%m-%d)"
            # Rebase on any concurrent changes, then push straight to main.
            # GITHUB_TOKEN with contents:write can push to main directly,
            # so we avoid the fragile PR-create/merge flow that requires
            # extra "create and approve pull requests" permissions.
            git pull --rebase origin main
            git push origin HEAD:main
            echo "Pushed AWS news update directly to main"
          fi
